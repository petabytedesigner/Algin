name: Category 30 - historical evidence readiness (research only)

on:
  push:
    branches:
      - research/category30-attested-parity-2026-11-25
    paths:
      - .github/workflows/category30-evidence-gate.yml
      - analytics/historical_evidence_gate.py
      - tests/test_category30_evidence_gate.py
      - docs/CATEGORY_30_EVIDENCE_GATE.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: category30-historical-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Immutable price and signal evidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run focused offline regression tests
        run: python -m unittest discover -s tests -p test_category30_evidence_gate.py -v

      - name: Download Category 29 frozen price coverage
        uses: actions/download-artifact@v4
        with:
          name: category29-research-price-coverage-45617330337
          path: ${{ runner.temp }}/category30-prices
          github-token: ${{ github.token }}
          run-id: 45617330337
          repository: ${{ github.repository }}

      - name: Download four frozen signal-year artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: category30-m15-signals-*-45645175399
          merge-multiple: true
          path: ${{ runner.temp }}/category30-signals
          github-token: ${{ github.token }}
          run-id: 45645175399
          repository: ${{ github.repository }}

      - name: Audit complete and immutable evidence lineage
        run: |
          python -u -m analytics.historical_evidence_gate \
            --dataset "$RUNNER_TEMP/category30-prices/EUR_USD_M15_MBA_RESEARCH_ATTESTED_b48e0f98a2fe948d83afd1d384ae8b23e28b04c1275425c06b543cf75dce5466.json" \
            --manifest "$RUNNER_TEMP/category30-prices/EUR_USD_M15_MBA_RESEARCH_ATTESTED_b48e0f98a2fe948d83afd1d384ae8b23e28b04c1275425c06b543cf75dce5466_MANIFEST.json" \
            --signals-dir "$RUNNER_TEMP/category30-signals" \
            --output "$RUNNER_TEMP/category30-evidence/category30-evidence-readiness.json"

      - name: Save immutable evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: category30-evidence-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/category30-evidence/category30-evidence-readiness.json
          if-no-files-found: warn
          retention-days: 90
