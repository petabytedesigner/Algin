name: Category 2 risk preparation verification
on:
  push:
    branches:
      - development/category-2-risk-trade-planning-2026-11-15
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py --check
