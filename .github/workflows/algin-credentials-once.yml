name: ALGIN one-shot OANDA and FMP read-only credential evidence
on:
  push:
    branches:
      - verification/oanda-fmp-readonly-2026-11-26

permissions:
  contents: read

jobs:
  oanda-practice-readonly:
    if: github.repository == 'petabytedesigner/Algin' && github.ref == 'refs/heads/verification/oanda-fmp-readonly-2026-11-26' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install existing runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify broker writes remain disabled
        run: python -c 'import config; from broker.practice_transport import _PRACTICE_WRITES_RELEASED; assert config.ORDER_WRITES_ENABLED is False; assert _PRACTICE_WRITES_RELEASED is False'
      - name: OANDA Practice authenticated GET-only evidence
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python -m operations.practice_ci_probe --run-actions

  fmp-minimal-readonly:
    if: github.repository == 'petabytedesigner/Algin' && github.ref == 'refs/heads/verification/oanda-fmp-readonly-2026-11-26' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Single FMP public symbol search GET, sanitized output
        env:
          FMP_API_KEY: ${{ secrets.FMP }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          key = os.environ.get("FMP_API_KEY", "")
          if not key:
              print("FMP_KEY_MISSING; requests=0")
              sys.exit(3)
          params = urlencode({"query": "AAPL", "limit": 1, "apikey": key})
          url = "https://financialmodelingprep.com/stable/search-symbol?" + params
          try:
              with urlopen(Request(url, method="GET", headers={"Accept": "application/json"}), timeout=15) as response:
                  code = response.status
                  payload = response.read(32768)
          except HTTPError as error:
              print("FMP_KEY_HTTP_" + str(error.code) + "; requests=1")
              sys.exit(3)
          except (URLError, TimeoutError, OSError):
              print("FMP_KEY_NETWORK_UNVERIFIED; requests=1")
              sys.exit(3)
          try:
              data = json.loads(payload)
          except (ValueError, UnicodeError):
              print("FMP_KEY_JSON_UNVERIFIED; requests=1")
              sys.exit(3)
          if code == 200 and isinstance(data, list) and any(
              isinstance(item, dict) and item.get("symbol") == "AAPL"
              for item in data
          ):
              print("FMP_KEY_AUTHENTICATED_SAMPLE_VERIFIED; requests=1")
              sys.exit(0)
          print("FMP_KEY_SAMPLE_UNVERIFIED; http=" + str(code) + "; requests=1")
          sys.exit(3)
          PY
