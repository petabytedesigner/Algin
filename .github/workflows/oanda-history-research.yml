name: OANDA M15 MBA historical research download

# One-off, read-only research. Intentionally does not run on main or PRs.
on:
  push:
    branches:
      - research/oanda-history-m15-2026-11-24
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-research:
    # Already downloaded on the research branch; do not redownload ~95k
    # M15 bars for every follow-up diagnostic commit.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify read-only historical ingestion regressions
        run: python -m unittest discover -s tests -p 'test_phase_e_category29.py' -v
      - name: Download and validate EUR_USD M15 MBA history
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path
          import sys

          # Existing local practice configuration is a fallback if the two
          # optional repository secrets are not configured. Never log values.
          for line in Path('.env.example').read_text(encoding='utf-8').splitlines():
              key, sep, value = line.partition('=')
              if sep and key in {'OANDA_API_TOKEN', 'OANDA_ACCOUNT_ID'}:
                  if not os.environ.get(key) and value.strip():
                      os.environ[key] = value.strip().strip('"').strip("'")

          from data.historical_oanda import (
              HistoricalDataError, _candle, _gaps, _time,
              fetch_range, load_dataset, save_dataset,
          )
          from utils.common import safe_request

          out = Path('.local/historical')
          out.mkdir(parents=True, exist_ok=True)
          start, end = '2023-01-01T00:00:00Z', '2026-10-31T00:00:00Z'
          report = {
              'status': 'BLOCKED',
              'source': 'OANDA_PRACTICE_V20_GET',
              'instrument': 'EUR_USD', 'granularity': 'M15', 'price': 'MBA',
              'from': start, 'to': end,
          }
          exit_code = 3
          observed_candles = []
          def observed_get(method, url, *, headers, params):
              response = safe_request(method, url, headers=headers, params=params)
              if response is not None and response.status_code == 200:
                  payload = response.json()
                  if isinstance(payload, dict) and isinstance(payload.get('candles'), list):
                      observed_candles.extend(payload['candles'])
              return response

          try:
              smoke = fetch_range('EUR_USD',
                                  '2026-10-26T12:00:00Z',
                                  '2026-10-26T13:00:00Z')
              if len(smoke['candles']) != 4:
                  raise HistoricalDataError('M15 smoke check did not return 4 bars')
              print('OANDA_READ_ONLY_SMOKE_OK; candles=4')

              dataset = fetch_range('EUR_USD', start, end, requester=observed_get)
              path = save_dataset(dataset, out)
              verified = load_dataset(path)
              report.update(
                  status='VERIFIED',
                  candles=len(verified['candles']),
                  pages=verified['request_pages'],
                  gaps=len(verified['gaps']),
                  sha256=path.stem.rsplit('_', 1)[-1],
                  file_name=path.name,
              )
              print('OANDA_HISTORY_VERIFIED; candles=' + str(report['candles']))
              exit_code = 0
          except HistoricalDataError as exc:
              report['reason'] = str(exc)
              print('OANDA_HISTORY_BLOCKED: ' + str(exc))
          except Exception:
              report['reason'] = 'Unexpected ingestion failure'
              print('OANDA_HISTORY_BLOCKED: unexpected ingestion failure')
          finally:
              # Diagnostics are never certified as backtest input. Preserve
              # all observed source bars without inserting synthetic candles.
              if report['status'] != 'VERIFIED' and observed_candles:
                  try:
                      bars = [_candle(item) for item in observed_candles]
                      gaps = _gaps(bars, _time(start), _time(end))
                      open_gaps = [gap for gap in gaps if gap['classification'] != 'WEEKEND_CLOSED']
                      report['observed_bars'] = len(bars)
                      report['market_open_gap_count'] = len(open_gaps)
                      report['market_open_gap_examples'] = open_gaps[:12]
                      candidate = {
                          'validation_status': 'UNVERIFIED_NOT_BACKTEST_APPROVED',
                          'source': 'OANDA_PRACTICE_V20_GET',
                          'instrument': 'EUR_USD', 'granularity': 'M15', 'price': 'MBA',
                          'from': start, 'to': end,
                          'candles': bars, 'gaps': gaps,
                      }
                      raw = (json.dumps(candidate, sort_keys=True, separators=(',', ':')) + '\n').encode('utf-8')
                      sha = hashlib.sha256(raw).hexdigest()
                      filename = 'UNVERIFIED_EUR_USD_M15_MBA_' + sha + '.json'
                      with (out / filename).open('xb') as output:
                          output.write(raw)
                      report['unverified_file'] = filename
                      report['unverified_sha256'] = sha
                  except Exception:
                      report['diagnostic_status'] = 'UNAVAILABLE'
              (out / 'download_status.json').write_text(
                  json.dumps(report, sort_keys=True, indent=2) + '\n',
                  encoding='utf-8',
              )
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## OANDA historical research\n\n')
                  summary.write('Status: **' + report['status'] + '**\n\n')
                  summary.write('EUR_USD M15 MBA, 2023-01-01 through 2026-10-31 UTC.\n\n')
                  if report['status'] == 'VERIFIED':
                      summary.write('Verified bars: ' + str(report['candles']) + '\n\n')
                      summary.write('SHA-256: `' + report['sha256'] + '`\n')
                  else:
                      summary.write('Reason: ' + report.get('reason', 'Unknown') + '\n')
                      summary.write('\nObserved bars: ' + str(report.get('observed_bars', 0)) + '\n')
                      summary.write('\nMarket-open gaps: ' + str(report.get('market_open_gap_count', 'unknown')) + '\n')
          sys.exit(exit_code)
          PY
      - name: Upload verified dataset or failure report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eur-usd-m15-mba-history-${{ github.sha }}
          path: .local/historical/
          if-no-files-found: warn
          retention-days: 90

  m1-gap-probe:
    # A focused GET-only check for the two missing M15 candles in Jan 2023.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare broker M1 bars with two absent M15 periods
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          for line in Path('.env.example').read_text(encoding='utf-8').splitlines():
              key, sep, value = line.partition('=')
              if sep and key in {'OANDA_API_TOKEN', 'OANDA_ACCOUNT_ID'}:
                  if not os.environ.get(key) and value.strip():
                      os.environ[key] = value.strip().strip('"').strip("'")

          import config
          from broker.practice_transport import PRACTICE_API
          from utils.common import safe_request
          from utils.time_tools import parse_utc

          report = {
              'source': 'OANDA_PRACTICE_V20_GET', 'instrument': 'EUR_USD',
              'granularity': 'M1', 'price': 'MBA',
              'from': '2023-01-02T02:00:00Z',
              'to': '2023-01-02T04:00:00Z',
              'status': 'UNVERIFIED',
              'windows': [],
          }
          out = Path('.local/historical')
          out.mkdir(parents=True, exist_ok=True)
          code = 3
          try:
              if config.OANDA_URL != PRACTICE_API or not config.API_KEY or not config.ACCOUNT_ID:
                  raise ValueError('OANDA Practice credentials unavailable')
              response = safe_request(
                  'GET',
                  PRACTICE_API + '/accounts/' + config.ACCOUNT_ID + '/instruments/EUR_USD/candles',
                  headers={'Authorization': 'Bearer ' + config.API_KEY},
                  params={'from': report['from'], 'to': report['to'],
                          'granularity': 'M1', 'price': 'MBA',
                          'smooth': 'false', 'includeFirst': 'true'},
              )
              if response is None or response.status_code != 200:
                  raise ValueError('M1 broker GET unavailable')
              payload = response.json()
              if (not isinstance(payload, dict)
                  or payload.get('instrument') != 'EUR_USD'
                  or payload.get('granularity') != 'M1'
                  or not isinstance(payload.get('candles'), list)):
                  raise ValueError('Unexpected M1 broker response')
              stamps = []
              for item in payload['candles']:
                  if not isinstance(item, dict) or item.get('complete') is not True:
                      raise ValueError('Malformed or incomplete M1 evidence')
                  stamp = parse_utc(item['time'])
                  if parse_utc(report['from']) <= stamp < parse_utc(report['to']):
                      stamps.append(stamp)
              if len(stamps) != len(set(stamps)) or stamps != sorted(stamps):
                  raise ValueError('Duplicate/unordered M1 timestamps')
              for beginning, ending in (
                  ('2023-01-02T02:30:00Z', '2023-01-02T02:45:00Z'),
                  ('2023-01-02T03:15:00Z', '2023-01-02T03:30:00Z'),
              ):
                  inside = [x for x in stamps if parse_utc(beginning) <= x < parse_utc(ending)]
                  report['windows'].append({
                      'from': beginning, 'to': ending,
                      'm1_bars': len(inside),
                      'classification': 'M1_PRESENT_M15_MISSING' if inside else 'NO_M1_BARS',
                  })
              report['total_m1_bars_in_2h'] = len(stamps)
              report['status'] = 'PROBE_COMPLETED'
              code = 0
              print('OANDA_M1_PROBE_OK; total_minutes=' + str(len(stamps)))
              for window in report['windows']:
                  print('MISSING_M15_WINDOW ' + window['from'] + ': M1_bars=' + str(window['m1_bars']))
          except Exception:
              report['status'] = 'PROBE_FAILED'
              report['reason'] = 'Broker response or validation unavailable'
              print('OANDA_M1_PROBE_FAILED')
          finally:
              (out / 'm1_gap_probe.json').write_text(
                  json.dumps(report, sort_keys=True, indent=2) + '\n',
                  encoding='utf-8',
              )
          sys.exit(code)
          PY
      - name: Upload M1 gap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eur-usd-m1-gap-probe-${{ github.sha }}
          path: .local/historical/m1_gap_probe.json
          if-no-files-found: error
          retention-days: 90
