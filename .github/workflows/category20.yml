name: Category 20 offline CI and Python compatibility audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-runtime-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check transitive dependency installation
        run: python -m pip check
      - name: Compile complete offline application
        run: python -m compileall -q .
      - name: Full offline unit and regression suite
        run: python -m unittest discover -s tests -v
      - name: Inspect CI action pins, dependency bounds and broker gates
        run: python -m operations.runtime_audit
      - name: Check Practice probe policy without accessing credentials
        run: python -m operations.practice_ci_probe --check
      - name: Check Termux supervisor policy without accessing credentials
        run: python -m operations.forward_supervisor --check
      - name: Check observe-only application
        run: python main.py --check
