name: Category 12 OANDA Practice real GET post-trade reconciliation
on:
  push:
    branches:
      - development/phase-c-category-12-direct-practice-2026-11-17
    paths:
      - .github/workflows/category12-followup.yml
permissions:
  contents: read
jobs:
  get-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Broker-authoritative state and sinceid from opening transaction 6
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import config
          from broker.practice_transport import PracticeTransport, BrokerReply, PRACTICE_API, _PRACTICE_WRITES_RELEASED
          values = {}
          for line in Path(".env.example").read_text(encoding="utf-8").splitlines():
              line=line.strip()
              if line and not line.startswith("#"):
                  k, v = map(str.strip, line.split("=", 1))
                  if k in ("OANDA_API_TOKEN", "OANDA_ACCOUNT_ID"):
                      values[k] = v
          if values.get("OANDA_ACCOUNT_ID") != "101-001-37674492-003" or not values.get("OANDA_API_TOKEN"):
              raise SystemExit("ACCOUNT_OR_TOKEN_INVALID")
          if config.OANDA_URL != PRACTICE_API or config.ORDER_WRITES_ENABLED is not False or _PRACTICE_WRITES_RELEASED is not False:
              raise SystemExit("WRITE_GATES_UNSAFE")
          config.ACCOUNT_ID = values["OANDA_ACCOUNT_ID"]
          config.API_KEY = values["OANDA_API_TOKEN"]
          transport = PracticeTransport()
          def read(p, params=None):
              response = transport.read(p, params=params)
              if response.status_code != 200 or not isinstance(response.body, dict):
                  raise SystemExit("BROKER_GET_FAILED_" + str(response.status_code))
              return response.body
          state = read("")
          a = state["account"]
          trades = [{
              "id": t.get("id"),
              "currentUnits": t.get("currentUnits"),
              "state": t.get("state"),
              "instrument": t.get("instrument"),
              "stopLoss": (t.get("stopLossOrder") or {}).get("price"),
              "takeProfit": (t.get("takeProfitOrder") or {}).get("price"),
              "ownTag": (t.get("clientExtensions") or {}).get("tag"),
          } for t in a.get("trades", [])]
          print("BROKER_POST_PARTIAL_INVENTORY " + json.dumps({
              "currency": a.get("currency"), "balance": a.get("balance"),
              "NAV": a.get("NAV"), "openTrades": a.get("openTradeCount"),
              "pendingOrders": a.get("pendingOrderCount"),
              "cursor": state.get("lastTransactionID"),
              "trades": trades,
          },sort_keys=True))
          tx = read("/transactions/sinceid", {"id": "6"})
          public=[]
          for item in tx.get("transactions", []):
              reduced=item.get("tradeReduced") or {}
              public.append({
                  "id":item.get("id"), "type":item.get("type"),
                  "reason":item.get("reason"),
                  "orderID":item.get("orderID"),
                  "tradeReduced_tradeID":reduced.get("tradeID"),
                  "tradeReduced_units":reduced.get("units"),
                  "tradesClosed":[{"tradeID":x.get("tradeID"),"units":x.get("units")} for x in item.get("tradesClosed",[])],
                  "fill_units":item.get("units"),
                  "pl":item.get("pl"),
              })
          print("BROKER_POST_PARTIAL_TRANSACTIONS "+json.dumps({
              "lastTransactionID":tx.get("lastTransactionID"),
              "items":public,
          },sort_keys=True))
          PY
