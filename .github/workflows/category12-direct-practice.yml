name: Category 12 direct OANDA Practice authenticated GET
on:
  push:
    branches:
      - development/phase-c-category-12-direct-practice-2026-11-17
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: algin-practice-direct-read
  cancel-in-progress: false
jobs:
  authenticated-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Real authenticated Practice GET using existing repo demo credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import runpy
          from broker.practice_transport import PRACTICE_API, _PRACTICE_WRITES_RELEASED
          import config

          # Treat the existing user-provided sample file as plain data,
          # NEVER as a shell script. Do not print or persist credentials.
          pairs = {}
          for raw in Path(".env.example").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if line.count("=") != 1:
                  raise SystemExit("PRACTICE_CONFIG_INVALID")
              name, value = map(str.strip, line.split("=", 1))
              if name not in ("OANDA_API_TOKEN", "OANDA_ACCOUNT_ID") or name in pairs:
                  raise SystemExit("PRACTICE_CONFIG_INVALID")
              pairs[name] = value
          if set(pairs) != {"OANDA_API_TOKEN", "OANDA_ACCOUNT_ID"}:
              raise SystemExit("PRACTICE_CONFIG_INCOMPLETE")
          if pairs["OANDA_ACCOUNT_ID"] != "101-001-37674492-003":
              raise SystemExit("PRACTICE_ACCOUNT_MISMATCH")
          if len(pairs["OANDA_API_TOKEN"]) < 20 or any(c.isspace() for c in pairs["OANDA_API_TOKEN"]):
              raise SystemExit("PRACTICE_TOKEN_MALFORMED")
          if config.OANDA_URL != PRACTICE_API or config.ORDER_WRITES_ENABLED is not False or _PRACTICE_WRITES_RELEASED is not False:
              raise SystemExit("PRACTICE_READ_ONLY_GATES_FAILED")
          os.environ.update(pairs)
          os.environ["OANDA_PRACTICE_EXPECTED_ACCOUNT_ID"] = pairs["OANDA_ACCOUNT_ID"]
          # config was imported for independent gate checks; bind the two
          # sanitized environment values before importing/running probe.
          config.API_KEY = pairs["OANDA_API_TOKEN"]
          config.ACCOUNT_ID = pairs["OANDA_ACCOUNT_ID"]
          print("PRACTICE_AUTHENTICATED_GET_ATTEMPT_STARTED")
          runpy.run_module("broker.practice_readonly_probe", run_name="__main__")
          PY
